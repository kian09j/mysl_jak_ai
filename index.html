<head>

<style>
  :root {
    --bg: #ffffff;
    --text: #37352f;
    --muted: #787774;
    --faint: #9b9a97;
    --line: #e9e9e7;
    --hover: #f7f7f5;
    --gray: #f1f1ef;
    --blue: #2383e2;
    --blue-hover: #0b6ec5;
    --blue-bg: #e7f3f8;
    --blue-text: #337ea9;
    --green: #448361;
    --green-bg: #dbeddb;
    --red: #d44c47;
    --red-bg: #fdebec;
    --yellow-bg: #fbf3db;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif, "Segoe UI Emoji", "Apple Color Emoji";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 680px; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .logo .ai {
    font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 85%;
    color: #eb5757; background: rgba(135, 131, 120, 0.15); border-radius: 4px; padding: 1px 5px;
  }
  .lang { display: flex; gap: 2px; background: var(--gray); border-radius: 6px; padding: 2px; }
  .lang button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
    background: transparent; border: 0; border-radius: 4px; padding: 2px 10px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(15, 15, 15, 0.12); }
  .lang button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .stats { display: flex; gap: 6px; }
  .pill {
    font-size: 13px; font-weight: 500; color: var(--muted); background: var(--gray);
    border-radius: 4px; padding: 2px 8px; display: flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .pill.bump { animation: bump 0.4s ease; }
  @keyframes bump { 50% { transform: scale(1.12); } }

  /* Progress: one segment per round */
  .trail { display: flex; gap: 4px; margin: 0 0 26px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--line); font-size: 0; overflow: hidden; }
  .step.now { background: var(--blue); }
  .step.ok { background: #6fbf8a; }
  .step.no { background: #e8a5a1; }

  .card { padding: 0; }
  .screen-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Mascot */
  .mascot { display: block; overflow: visible; }
  .mascot { transform-origin: 50% 100%; }
  .mascot .eyes-open { transform-origin: 60px 56px; animation: blink 5s ease-in-out infinite; }
  .mascot .eyes-happy, .mascot .m-big, .mascot .m-o { display: none; }
  .mascot[data-mood="happy"] .eyes-open, .mascot[data-mood="happy"] .m-smile { display: none; }
  .mascot[data-mood="happy"] .eyes-happy, .mascot[data-mood="happy"] .m-big { display: inline; }
  .mascot[data-mood="happy"] { animation: hop 0.5s ease; }
  .mascot[data-mood="oops"] .m-smile { display: none; }
  .mascot[data-mood="oops"] .m-o { display: inline; }
  .mascot[data-mood="oops"] { animation: shake 0.4s ease; }
  .mascot .pupil { transition: transform 0.3s; }
  .mascot[data-mood="think"] .pupil { transform: translate(2px, -2px); }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
  @keyframes hop { 50% { transform: translateY(-8px); } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .guide { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .guide .mascot { width: 44px; height: 44px; flex: 0 0 44px; }
  .bubble { flex: 1; background: var(--gray); border-radius: 6px; padding: 10px 14px; }
  .bubble.ok { background: var(--green-bg); }
  .bubble.no { background: var(--red-bg); }
  .bubble.pop { animation: fadeIn 0.25s ease; }

  .round-tag {
    display: inline-block; font-size: 12px; font-weight: 500; color: var(--blue-text); background: var(--blue-bg);
    border-radius: 4px; padding: 1px 7px; margin-bottom: 8px;
  }

  /* Context callout */
  .context {
    display: flex; gap: 10px; align-items: flex-start; background: var(--yellow-bg);
    border-radius: 6px; padding: 12px 14px; margin: 4px 0 16px; font-size: 15px;
  }
  .context .ico { font-size: 18px; line-height: 1.3; }

  .sentence { font-size: 26px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; margin: 4px 0 22px; }
  .blank {
    display: inline-block; min-width: 3.5em; text-align: center; padding: 0 4px;
    color: var(--blue); border-bottom: 2px solid var(--blue);
  }
  .blank.pop { animation: fadeIn 0.25s ease; }

  /* Answer options */
  .options { display: grid; gap: 8px; }
  .opt {
    position: relative; overflow: hidden; width: 100%; font: inherit; text-align: left; color: var(--text);
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
    transition: background 0.12s, border-color 0.12s;
  }
  .opt:hover:not(:disabled) { background: var(--hover); border-color: #dcdcd9; }
  .opt:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt .fill {
    position: absolute; inset: 0 auto 0 0; width: 0; z-index: 0; background: var(--c);
    transition: width 0.8s cubic-bezier(.2, .8, .2, 1);
  }
  .opt .badge, .opt .word, .opt .right { position: relative; z-index: 1; }
  .opt .badge {
    flex: 0 0 24px; height: 24px; border-radius: 4px; background: rgba(255, 255, 255, 0.7);
    box-shadow: inset 0 0 0 1px var(--line); color: var(--muted);
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
  }
  .opt .word { font-weight: 500; flex: 1; }
  .opt .right { display: flex; align-items: center; gap: 6px; }
  .opt .pct {
    font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums;
    opacity: 0; transition: opacity 0.3s 0.4s;
  }
  .revealed .opt .pct { opacity: 1; }
  .opt.top { --c: var(--green-bg) !important; border-color: #b9dcc0; }
  .opt.top .pct { color: var(--green); }
  .opt.drawn { animation: flashRow 0.7s ease; }
  @keyframes flashRow { 30% { box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.35); } }

  .stamp {
    font-size: 12px; font-weight: 500; color: var(--green); background: #fff; border-radius: 4px;
    padding: 1px 6px; white-space: nowrap; animation: fadeIn 0.3s 0.6s both;
  }
  .sticker {
    font-size: 12px; font-weight: 500; color: var(--text); background: rgba(227, 226, 224, 0.95);
    border-radius: 4px; padding: 1px 6px; white-space: nowrap;
  }

  /* Extra reveal */
  .extra {
    margin-top: 14px; padding: 12px 14px; border-radius: 6px; background: var(--red-bg);
    display: flex; align-items: center; gap: 10px; font-weight: 600; animation: fadeIn 0.3s 0.4s both;
  }
  .extra .bang {
    flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--red); color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }

  /* Sampling */
  .sample {
    margin-top: 14px; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; animation: fadeIn 0.25s ease;
  }
  .sample-out b { color: var(--blue); }
  .sample-out.flash { animation: fadeIn 0.25s ease; }
  .history { width: 100%; font-size: 13px; color: var(--muted); }
  .die { display: inline-block; }
  .rolling .die { animation: roll 0.5s ease; }
  @keyframes roll { to { transform: rotate(360deg); } }

  /* Lesson callout */
  .lesson { margin-top: 18px; padding: 14px 16px; border-radius: 6px; background: var(--gray); animation: fadeIn 0.3s 0.1s both; }
  .lesson h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .lesson p { margin: 0; }

  /* Buttons */
  .btn {
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; border: 0; border-radius: 6px;
    padding: 8px 16px; background: var(--blue); color: #fff; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; transition: background 0.12s;
    box-shadow: inset 0 0 0 1px rgba(15, 15, 15, 0.1), 0 1px 2px rgba(15, 15, 15, 0.1);
  }
  .btn:hover { background: var(--blue-hover); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn.secondary { background: #fff; color: var(--text); box-shadow: inset 0 0 0 1px rgba(15, 15, 15, 0.16); }
  .btn.secondary:hover { background: var(--hover); }
  .actions { margin-top: 20px; display: flex; justify-content: flex-end; }

  .footnote { margin: 32px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
  .hidden { display: none !important; }

  /* Start and end pages */
  .center { text-align: left; }
  .hero { display: flex; flex-direction: column; align-items: flex-start; }
  .hero .mascot { width: 76px; height: 76px; margin: 12px 0 10px; }
  .hero .bubble { flex: none; width: 100%; margin: 0 0 8px; }
  h1 { font-size: 38px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 14px; }
  h2 { font-size: 20px; font-weight: 600; margin: 28px 0 10px; }

  .how { width: 100%; margin: 10px 0 18px; }
  .how h2 { margin-top: 12px; }
  .how ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  .how li { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
  .how .num {
    flex: 0 0 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
    font-size: 14px; font-weight: 600;
  }
  .how strong { display: block; font-weight: 600; }
  .how p { margin: 2px 0 0; color: var(--muted); }
  .how .example {
    margin-top: 10px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line);
    font-size: 14px; color: var(--text);
  }
  .how .example .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .how .example .w { flex: 0 0 7em; }
  .how .example .bar { height: 8px; border-radius: 4px; background: #d3e5ef; }
  .how .example .row:first-of-type .bar { background: #a8d5b5; }
  .how .example .pc { font-size: 13px; font-weight: 600; color: var(--muted); }
  .expect { width: 100%; background: var(--blue-bg); border-radius: 6px; padding: 12px 14px; margin: 0 0 22px; }
  .expect strong { font-weight: 600; }
  .expect p { margin: 2px 0 0; }

  .score-blob { margin: 0; }
  .score-blob b { font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  .score-blob span { color: var(--muted); }
  .score-msg { color: var(--muted); margin: 4px 0 4px; }
  .rules { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 6px; }
  .rules li {
    display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 6px;
    background: var(--bg-note); animation: fadeIn 0.3s both; animation-delay: var(--delay);
  }
  .rules .num {
    flex: 0 0 24px; height: 24px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(15, 15, 15, 0.1);
  }
  .rules strong { font-weight: 600; }

  @media (max-width: 480px) {
    body { padding-top: 16px; }
    h1 { font-size: 30px; }
    .sentence { font-size: 21px; }
    .actions .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo" id="logo">Myśl jak <span class="ai">AI</span></div>
    <div class="lang" id="lang" role="group" aria-label="Język / Language">
      <button type="button" data-lang="pl" aria-pressed="true">PL</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="stats hidden" id="stats">
      <div class="pill" id="progressText">1/13</div>
      <div class="pill" id="scoreText"></div>
    </div>
  </header>
  <div class="trail hidden" id="trail"></div>

  <main class="card" id="screen"></main>
  <p class="footnote hidden" id="footnote">Prawdopodobieństwa są przykładowe, żeby pokazać zasadę działania.</p>
</div>

<script>
const ROUNDS_PL = [
  {
    sentence: "Dzień dobry, w nawiązaniu do naszej ___",
    options: [["rozmowy", 68], ["współpracy", 17], ["umowy", 11], ["wycieczki", 4]],
    lesson: "AI wybiera słowa, które najczęściej pojawiały się w podobnych tekstach. Dlatego maile pisane przez AI brzmią tak przewidywalnie."
  },
  {
    sentence: "Dziękuję za szybką ___",
    options: [["odpowiedź", 81], ["reakcję", 11], ["pomoc", 6], ["decyzję", 2]],
    sampling: true,
    lesson: "AI nie zawsze bierze najbardziej prawdopodobne słowo, czasem losuje. Dlatego ta sama prośba daje różne wersje odpowiedzi."
  },
  {
    sentence: "Proszę o przesłanie raportu do ___",
    options: [["piątku", 46], ["jutra", 31], ["końca tygodnia", 19], ["Wielkanocy", 4]],
    lesson: "AI nie zna Twojego terminu. Jeśli go nie podasz, zgadnie to, co typowe. Konkretne informacje wpisuj w polecenie."
  },
  {
    sentence: "Spotkanie zespołu odbędzie się w sali ___",
    options: [["konferencyjnej", 61], ["numer 2", 18], ["głównej", 15], ["Zielonej", 6]],
    lesson: "Bez kontekstu AI wybiera najbardziej ogólną odpowiedź. Zobacz, co się zmieni w następnej rundzie."
  },
  {
    context: "Kalendarz: Marketing ma stałą rezerwację w Sali Zielonej.",
    icon: "calendar",
    sentence: "Spotkanie zespołu marketingu odbędzie się w Sali ___",
    options: [["Zielonej", 91], ["konferencyjnej", 5], ["numer 2", 3], ["głównej", 1]],
    lesson: "Ten sam model, inna odpowiedź. Kontekst zmienia wszystko. Dlatego Copilot działa lepiej, gdy ma dostęp do Twoich maili i plików."
  },
  {
    sentence: "W trzecim kwartale nasza sprzedaż wzrosła o ___",
    options: [["10%", 34], ["15%", 27], ["20%", 22], ["3%", 17]],
    extra: "W Twoim raporcie: 3%.",
    lesson: "Najbardziej prawdopodobne nie znaczy prawdziwe. Gdy AI nie widzi danych, wymyśla przekonująco brzmiącą liczbę. To jest halucynacja. Liczby zawsze sprawdzaj."
  },
  {
    sentence: "Przekaż proszę te dane Ani z działu ___",
    options: [["sprzedaży", 38], ["marketingu", 29], ["HR", 21], ["IT", 12]],
    lesson: "AI nie wie, o którą Anię chodzi. Gdy coś jest niejednoznaczne, zgaduje. Precyzuj: kto, co, kiedy."
  },
  {
    sentence: "Hej ekipo, w piątek robimy ___",
    options: [["pizzę", 44], ["imprezę", 31], ["spotkanie", 19], ["posiedzenie", 6]],
    lesson: "Luźny początek, luźne słowa. AI dopasowuje się do stylu tekstu, który już widzi. Zobacz, co się stanie, gdy zaczniemy formalnie."
  },
  {
    sentence: "Szanowni Państwo, w piątek odbędzie się ___",
    options: [["spotkanie", 57], ["posiedzenie", 28], ["szkolenie", 12], ["impreza", 3]],
    lesson: "Ten sam piątek, inny ton. Styl początku decyduje o reszcie. Napisz w poleceniu, jakiego tonu oczekujesz: formalnego, luźnego, krótkiego."
  },
  {
    context: "Wzór z polecenia: „Temat: [Projekt Beta] Status tygodniowy”",
    icon: "note",
    sentence: "Temat: [Projekt Alfa] ___",
    options: [["Status tygodniowy", 88], ["Aktualizacja", 6], ["Ważne", 4], ["Pilne!!!", 2]],
    lesson: "Pokaż AI przykład, a skopiuje jego format. Jeden dobry wzór działa lepiej niż długi opis tego, czego chcesz."
  },
  {
    sentence: "Zgodnie z nową polityką możemy pracować zdalnie ___ dni w tygodniu",
    options: [["2", 41], ["3", 33], ["1", 16], ["5", 10]],
    extra: "W polityce wprowadzonej w zeszłym miesiącu: 4 dni.",
    lesson: "AI nie wie, co niedawno zmieniło się w Twojej firmie. Gdy nie widzi aktualnego dokumentu, podaje to, co typowe. Wskaż źródło, np. „na podstawie pliku Polityka pracy zdalnej”."
  },
  {
    sentence: "Nowa osoba w zespole IT ma na imię ___",
    options: [["Tomek", 39], ["Michał", 34], ["Kasia", 15], ["Ola", 12]],
    lesson: "AI powtarza schematy z tekstów, na których się uczyło, także stereotypy. Sprawdzaj, czy odpowiedź nie zakłada czegoś, czego nie było w poleceniu."
  },
  {
    context: "Pytasz AI: „Mój plan jest świetny, prawda?”",
    icon: "chat",
    sentence: "Tak, ten plan jest ___",
    options: [["świetny", 47], ["dobry", 29], ["ciekawy", 16], ["ryzykowny", 8]],
    lesson: "AI często przytakuje, bo po takim pytaniu w tekstach zwykle pada „tak”. Pytaj neutralnie: „Jakie są słabe strony tego planu?”."
  }
];

const RULES_PL = [
  ["Dawaj kontekst", "pliki, maile, szczegóły."],
  ["Precyzuj", "kto, co, kiedy, ile."],
  ["Sprawdzaj fakty i liczby", "AI brzmi pewnie, nawet gdy zgaduje."],
  ["Pokaż wzór i określ ton", "jeden przykład mówi więcej niż długi opis."],
  ["Pytaj neutralnie", "zamiast „prawda, że dobre?” zapytaj „co tu jest słabe?”."]
];

const ROUNDS_EN = [
  {
    sentence: "Hi, following up on our ___",
    options: [["conversation", 68], ["partnership", 17], ["contract", 11], ["trip", 4]],
    lesson: "AI picks the words that most often appeared in similar texts. That's why emails written by AI sound so predictable."
  },
  {
    sentence: "Thank you for your quick ___",
    options: [["reply", 81], ["response", 11], ["help", 6], ["decision", 2]],
    sampling: true,
    lesson: "AI doesn't always take the most likely word. Sometimes it rolls the dice. That's why the same request gives different versions of an answer."
  },
  {
    sentence: "Please send the report by ___",
    options: [["Friday", 46], ["tomorrow", 31], ["the end of the week", 19], ["Easter", 4]],
    lesson: "AI doesn't know your deadline. If you don't give it one, it guesses what's typical. Put specific details in your prompt."
  },
  {
    sentence: "The team meeting will be held in the ___ room",
    options: [["conference", 61], ["meeting", 18], ["main", 15], ["Green", 6]],
    lesson: "Without context, AI picks the most generic answer. See what changes in the next round."
  },
  {
    context: "Calendar: Marketing has a standing booking for the Green Room.",
    icon: "calendar",

];

function starsWordPl(n) {
  if (n === 1) return "gwiazdka";
  const last = n % 10, lastTwo = n % 100;
  return last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14) ? "gwiazdki" : "gwiazdek";
}

// Set by setLang(): the active language's rounds, rules and UI text.
let ROUNDS = ROUNDS_PL, RULES = RULES_PL, T = TEXT.pl;
let lang = "pl";


const OPTION_COLORS = ["#fadec9", "#d3e5ef", "#e8deee", "#f5e0e9"];
const NOTE_COLORS = ["#fbf3db", "#edf3ec", "#e7f3f8", "#f6f3f9", "#faf1f5"];

const ICONS = {
  star: "⭐",
  calendar: "📅",
  note: "📝",
  chat: "💬",
  bulb: "💡",
  die: `<span class="die">🎲</span>`,
  arrow: "→"
};

// Bajtek, the little robot guide, drawn as simple line art. Mood: idle, think, happy, oops.

const $ = (id) => document.getElementById(id);
const screen = $("screen");
let current = 0;
let score = 0;
let results = [];
let view = "start";

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sentenceHTML(s, word) {
  const fill = word ? esc(word) : "&nbsp;&nbsp;&nbsp;";
  return esc(s).replace("___", `<span class="blank${word ? " pop" : ""}">${fill}</span>`);
}

function setScreen(html) {
  screen.classList.remove("screen-in");
  screen.innerHTML = html;
  void screen.offsetWidth;
  screen.classList.add("screen-in");
}

function setChrome(inGame) {
  $("stats").classList.toggle("hidden", !inGame);
  $("trail").classList.toggle("hidden", !inGame);
  $("footnote").classList.toggle("hidden", !inGame);
  $("lang").classList.toggle("hidden", inGame);
}

function readSavedLang() {
  try { return localStorage.getItem("lang"); } catch (e) { return null; }
}

function setLang(l) {
  lang = l === "en" ? "en" : "pl";
  ROUNDS = lang === "en" ? ROUNDS_EN : ROUNDS_PL;
  RULES = lang === "en" ? RULES_EN : RULES_PL;
  T = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  $("logo").innerHTML = T.logo;
  $("footnote").textContent = T.footnote;
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("lang", lang); } catch (e) { /* storage unavailable */ }
}

document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  setLang(b.dataset.lang);
  if (view === "end") showEnd(); else showStart();
}));

function updateStats(bump) {
  $("progressText").textContent = `${current + 1}/${ROUNDS.length}`;
  const sp = $("scoreText");
  sp.innerHTML = `${ICONS.star}<span>${score}</span>`;
  sp.setAttribute("aria-label", `${T.points}: ${score}`);
  if (bump) { sp.classList.remove("bump"); void sp.offsetWidth; sp.classList.add("bump"); }
  $("trail").innerHTML = ROUNDS.map((_, i) => {
    if (i < results.length) return results[i] ? `<span class="step ok">${ICONS.star}</span>` : `<span class="step no"></span>`;
    return `<span class="step${i === current ? " now" : ""}"></span>`;
  }).join("");
}

/* ---------- Screens ---------- */
function titleHTML(text) {
  return esc(text);
}

function startGame() { current = 0; score = 0; results = []; showRound(); }

function showStart() {
  view = "start";
  setChrome(false);
  setScreen(`
    <div class="hero center">
      ${mascot("idle")}
      <h1>${titleHTML(T.title)}</h1>
      <div class="bubble">👋 ${esc(T.hello)}</div>
      <section class="how">
        <h2>${esc(T.howTitle)}</h2>
        <ol>
          ${T.how.map(([t, d], i) => `
            <li>
              <span class="num" style="background:${OPTION_COLORS[i]}">${i + 1}</span>
              <div>
                <strong>${esc(t)}</strong>
                <p>${esc(d)}</p>
                ${i === 1 ? `<div class="example">${esc(T.example.sentence)}
                  ${T.example.rows.map(([w, pc]) => `<div class="row"><span class="w">${esc(w)}</span><span class="bar" style="width:${pc * 1.2}px"></span><span class="pc">${pc}%</span></div>`).join("")}
                </div>` : ""}
              </div>
            </li>`).join("")}
        </ol>
      </section>
      <div class="expect"><strong>${esc(T.expectTitle)}</strong><p>${esc(T.expect)}</p></div>
      <button class="btn" id="startBtn">${esc(T.start)} ${ICONS.arrow}</button>
    </div>`);
  $("startBtn").onclick = startGame;
  $("startBtn").focus();
}

function showRound() {
  view = "round";
  setChrome(true);
  updateStats();
  const r = ROUNDS[current];
  const order = shuffle(r.options);
  const letters = ["A", "B", "C", "D"];
  setScreen(`
    <div class="guide">
      ${mascot("think")}
      <div class="bubble" id="bubble">${esc(T.think)}</div>
    </div>
    <span class="round-tag">${esc(T.round)} ${current + 1}</span>
    ${r.context ? `<div class="context"><span class="ico">${ICONS[r.icon] || ICONS.note}</span><span>${esc(r.context)}</span></div>` : ""}
    <p class="sentence" id="sentence">${sentenceHTML(r.sentence)}</p>
    <div class="options" id="options">
      ${order.map(([w, p], i) => `
        <button class="opt" data-word="${esc(w)}" data-p="${p}" style="--c:${OPTION_COLORS[i]}">
          <span class="fill"></span>
          <span class="badge">${letters[i]}</span>
          <span class="word">${esc(w)}</span>
          <span class="right"><span class="pct">${p}%</span></span>
        </button>`).join("")}
    </div>
    <div id="after"></div>`);
  screen.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => reveal(b)));
  screen.querySelector(".opt").focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function setBubble(text, cls) {
  const b = $("bubble");
  b.textContent = text;
  b.className = "bubble pop " + (cls || "");
}

function reveal(btn) {
  const r = ROUNDS[current];
  const top = r.options.reduce((a, b) => (b[1] > a[1] ? b : a));
  const picked = btn.dataset.word;
  const correct = picked === top[0];
  if (correct) score++;
  results.push(correct);
  updateStats(correct);

  const opts = $("options");
  opts.classList.add("revealed");
  opts.querySelectorAll(".opt").forEach((b) => {
    b.disabled = true;
    const right = b.querySelector(".right");
    if (b.dataset.word === top[0]) {
      b.classList.add("top");
      right.insertAdjacentHTML("afterbegin", `<span class="stamp">${esc(T.stamp)}</span>`);
    }
    if (b === btn) right.insertAdjacentHTML("afterbegin", `<span class="sticker">${esc(T.you)}</span>`);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    opts.querySelectorAll(".opt").forEach((b) => {
      const f = b.querySelector(".fill");
      f.style.width = b.dataset.p + "%";
    });
  }));
  $("sentence").innerHTML = sentenceHTML(r.sentence, top[0]);

  screen.querySelector(".mascot").dataset.mood = correct ? "happy" : "oops";
  if (correct) {
    setBubble(T.ok, "ok");
  } else {
    setBubble(T.no(top[0]), "no");
  }

  const after = $("after");
  const isLast = current === ROUNDS.length - 1;
  const canSample = !!r.sampling;
  setTimeout(() => {
    let html = "";
    if (r.extra) html += `<div class="extra"><span class="bang">!</span><span>${esc(r.extra)}</span></div>`;
    if (canSample) html += `
      <div class="sample">
        <button class="btn secondary" id="sampleBtn">${ICONS.die} ${esc(T.sample)}</button>
        <span class="sample-out" id="sampleOut">${esc(T.sampleHint)}</span>
        <div class="history hidden" id="history"></div>
      </div>`;
    html += `
      <div class="lesson"><h3>${ICONS.bulb} ${esc(T.lesson)}</h3><p>${esc(r.lesson)}</p></div>
      <div class="actions"><button class="btn" id="nextBtn">${esc(isLast ? T.result : T.next)} ${ICONS.arrow}</button></div>`;
    after.innerHTML = html;
    if (canSample) setupSampling(r);
    $("nextBtn").onclick = () => {
      if (isLast) showEnd(); else { current++; showRound(); }
    };
    after.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, 1000);
}

function sampleWord(options) {
  const total = options.reduce((s, o) => s + o[1], 0);
  let x = Math.random() * total;
  for (const [w, p] of options) { if ((x -= p) < 0) return w; }
  return options[options.length - 1][0];
}

function setupSampling(r) {
  const counts = {};
  let n = 0;
  const btn = $("sampleBtn");
  btn.onclick = () => {
    const w = sampleWord(r.options);
    counts[w] = (counts[w] || 0) + 1;
    n++;
    btn.classList.remove("rolling"); void btn.offsetWidth; btn.classList.add("rolling");
    const out = $("sampleOut");
    out.classList.remove("flash"); void out.offsetWidth; out.classList.add("flash");
    out.innerHTML = `${esc(T.sampled)} <b>${esc(w)}</b>`;
    $("sentence").innerHTML = sentenceHTML(r.sentence, w);
    screen.querySelectorAll(".opt").forEach((o) => {
      if (o.dataset.word === w) { o.classList.remove("drawn"); void o.offsetWidth; o.classList.add("drawn"); }
    });
    const hist = $("history");
    hist.classList.remove("hidden");
    hist.textContent = `${T.draws} (${n}): ` + r.options
      .filter(([word]) => counts[word])
      .map(([word]) => `${word} × ${counts[word]}`).join(", ");
  };
}

function showEnd() {
  view = "end";
  setChrome(false);
  const total = ROUNDS.length;
  const msg = T.msgs[score === total ? 0 : score >= total - 3 ? 1 : score >= Math.ceil(total / 2) ? 2 : 3];
  const good = score >= Math.ceil(total / 2);
  setScreen(`
    <div class="hero center">
      ${mascot(good ? "happy" : "think")}
      <div class="score-blob"><div><b>${score}/${total}</b><br><span>${esc(T.stars(score))}</span></div></div>
      <p class="score-msg">${msg}</p>
    </div>
    <h2>${esc(T.endTitle)}</h2>
    <ol class="rules">
      ${RULES.map(([t, d], i) => `
        <li style="--bg-note:${NOTE_COLORS[i % NOTE_COLORS.length]};--tilt:${i % 2 ? 0.8 : -0.8}deg;--delay:${0.15 + i * 0.12}s">
          <span class="num">${i + 1}</span><div><strong>${esc(t)}:</strong> ${esc(d)}</div>
        </li>`).join("")}
    </ol>
    <div class="center"><button class="btn" id="againBtn">${esc(T.again)} ${ICONS.arrow}</button></div>`);
  $("againBtn").onclick = startGame;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const urlLang = new URLSearchParams(location.search).get("lang");
setLang(urlLang === "en" || urlLang === "pl" ? urlLang : readSavedLang() || "pl");
showStart();
</script>
